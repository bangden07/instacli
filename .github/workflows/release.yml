name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY_NAME="instacli-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          go build -ldflags="-s -w" -o ${BINARY_NAME} ./cmd/instacli
          chmod +x ${BINARY_NAME} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: instacli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: instacli-*

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: InstaCli ${{ github.ref_name }}
          body: |
            ## InstaCli ${{ github.ref_name }}

            ### 📥 Installation

            **Quick Install (Linux/macOS):**
            ```bash
            curl -sSL https://raw.githubusercontent.com/bangden07/instacli/main/install.sh | bash
            ```

            **Manual Download:**
            Download the appropriate binary for your platform below.

            ### 📦 Binaries

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Linux | amd64 | `instacli-linux-amd64` |
            | Linux | arm64 | `instacli-linux-arm64` |
            | macOS | amd64 (Intel) | `instacli-darwin-amd64` |
            | macOS | arm64 (Apple Silicon) | `instacli-darwin-arm64` |
            | Windows | amd64 | `instacli-windows-amd64.exe` |

            ### ✨ Features

            - 28+ One-click installers
            - Beautiful TUI interface
            - Clone & Setup repositories
            - SSH remote installation
            - Auto-detect project types

            ### 📚 Documentation

            - [Wiki](https://github.com/bangden07/instacli/wiki)
            - [README](https://github.com/bangden07/instacli#readme)
          draft: false
          prerelease: false
          files: artifacts/*
